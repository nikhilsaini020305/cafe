<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Menu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("https://images.pexels.com/photos/374147/pexels-photo-374147.jpeg") no-repeat center center/cover;
      color: white;
    }

    .menu-section {
      background: rgba(0, 0, 0, 0.7);
      padding: 60px 20px;
      text-align: center;
    }

    .menu-section h3 {
      font-style: italic;
      color: #c8a06c;
      margin-bottom: 5px;
    }

    .menu-section h1 {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0;
    }

    .menu-section hr {
      width: 60px;
      border: 1px solid #c8a06c;
      margin: 15px auto 40px auto;
    }

    .menu-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: auto;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
    }

    .menu-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
      margin-right: 15px;
    }

    .menu-text {
      flex: 1;
      text-align: left;
    }

    .menu-text h4 {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
    }

    .menu-text p {
      margin: 3px 0;
      font-size: 14px;
      color: #ccc;
    }

    .price {
      font-weight: bold;
      font-size: 16px;
    }

    .new-tag {
      display: inline-block;
      background: #c8a06c;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <section class="menu-section">
    <h3>What Happens Here</h3>
    <h1>FAVOURITE COFFEE FLAVOURS.</h1>
    <hr>

    <div class="menu-container">
      <!-- Item 1 -->
      <div class="menu-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/A_small_cup_of_coffee.JPG" alt="Caffe Latte">
        <div class="menu-text">
          <h4>CAFFE LATTE</h4>
          <p>Fresh brewed coffee and steamed milk</p>
        </div>
        <div class="price">$2.95 <span class="new-tag">New</span></div>
      </div>

      <!-- Item 2 -->
      <div class="menu-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7d/Mocha_coffee.jpg" alt="Caffe Mocha">
        <div class="menu-text">
          <h4>CAFFE MOCHA</h4>
          <p>Espresso with Milk, and Whipped Cream</p>
        </div>
        <div class="price">$3.67</div>
      </div>

      <!-- Item 3 -->
      <div class="menu-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Caramel_Macchiato_at_Starbucks.jpg" alt="Iced Caramel Latte">
        <div class="menu-text">
          <h4>ICED CARAMEL LATTE</h4>
          <p>Espresso, Milk, Ice and Caramel Sauce</p>
        </div>
        <div class="price">$4.67</div>
      </div>

      <!-- Item 4 -->
      <div class="menu-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/A_small_cup_of_coffee.JPG" alt="Espresso Macchiato">
        <div class="menu-text">
          <h4>ESPRESSO MACCHIATO</h4>
          <p>Rich Espresso with Milk and Foam</p>
        </div>
        <div class="price">$2.98</div>
      </div>
    </div>
  </section>

</body>
</html>
