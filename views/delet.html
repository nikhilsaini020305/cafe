
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Step 2 - Select Items</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8f2; }
    h1 { margin-top: 100px; text-align: center; color: #e67300; }
    .form {
      max-width: 900px; margin: 20px auto; padding: 20px;
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .item-box {
      border-bottom: 1px solid #ddd; padding: 15px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .qty-btn {
      padding: 6px 12px; font-size: 16px; cursor: pointer;
    }
    .qty-display {
      margin: 0 10px; font-size: 18px; width: 20px; display:inline-block; text-align: center;
    }
    #displayTotal {
      font-size: 20px; font-weight: bold; margin-top: 20px; text-align: center;
    }
  </style>

<script>
  function changeQty(id, price, change) {
    let qtySpan = document.getElementById("qty-" + id);
    let qty = parseInt(qtySpan.innerText) + change;

    if (qty < 0) qty = 0;

    qtySpan.innerText = qty;

    document.getElementById("input-" + id).value = qty;

    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;
    const allQtyInputs = document.querySelectorAll(".qty-input");

    allQtyInputs.forEach(i => {
      const qty = parseInt(i.value);
      const price = parseInt(i.dataset.price);
      total += qty * price;
    });

    document.getElementById("total").value = total;
    document.getElementById("displayTotal").innerText = "Total: ₹ " + total;
  }
</script>

</head>
<body>

<h1>Food Menu</h1>

<form action="/order" method="POST" class="form">

  <!-- ITEM TEMPLATE -->
  <div class="item-box">
      <div>
        <b>CAFFE LATTE</b><br>
        Fresh brewed coffee and steamed milk — ₹500
      </div>
      <div>
        <button type="button" class="qty-btn" onclick="changeQty(1,500,-1)">-</button>
        <span id="qty-1" class="qty-display">0</span>
        <button type="button" class="qty-btn" onclick="changeQty(1,500,1)">+</button>

        <input type="hidden" name="items[CAFFE LATTE]" id="input-1" class="qty-input" value="0" data-price="500">
      </div>
  </div>

  <div class="item-box">
      <div>
        <b>ICED CARAMEL LATTE</b><br>
        Espresso, Milk, Ice & Caramel Sauce — ₹500
      </div>
      <div>
        <button type="button" class="qty-btn" onclick="changeQty(2,500,-1)">-</button>
        <span id="qty-2" class="qty-display">0</span>
        <button type="button" class="qty-btn" onclick="changeQty(2,500,1)">+</button>

        <input type="hidden" name="items[ICED CARAMEL LATTE]" id="input-2" class="qty-input" value="0" data-price="500">
      </div>
  </div>

  <!-- You can repeat the same block for all items -->
  <!-- Just change: id, item name, price -->

  <p id="displayTotal">Total: ₹ 0</p>
  <input type="hidden" id="total" name="total" value="0">

  <button type="submit">Submit Order</button>

</form>

</body>
</html>
